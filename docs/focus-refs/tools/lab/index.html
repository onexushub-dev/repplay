<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcar · Modo Foco lab</title>
<style>
  :root { --ground: #0b0b09; --surface: #1b1d18; --raised: #24271f; --border: #3a3d34; --text: #f3ede1; --muted: #a9a79c;
          --accent: #d6f23f; --ok: #35e06b; --warn: #ff8a3d; --rec: #ff5a36; --neg: #ff4d6d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--text); font: 14px/1.4 -apple-system, system-ui, sans-serif;
         display: grid; grid-template-rows: auto 1fr auto auto; overflow: hidden; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: var(--surface);
           border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0 4px 0 0; }
  select, button { background: var(--raised); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
                   padding: 6px 10px; font: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: var(--raised); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--ground); font-weight: 600; }
  .muted { color: var(--muted); }
  .chip { padding: 4px 10px; border-radius: 999px; background: var(--raised); border: 1px solid var(--border);
          font-size: 13px; white-space: nowrap; }
  .chip.run { border-color: var(--accent); color: var(--accent); }
  .chip.err { border-color: var(--rec); color: var(--rec); }
  #bar { flex: 1; min-width: 120px; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  #bar div { height: 100%; background: var(--accent); width: 0; }
  main { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; cursor: crosshair; }
  #frame { display: block; user-select: none; -webkit-user-drag: none; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--raised);
           border: 1px solid var(--warn); color: var(--text); padding: 6px 14px; border-radius: 8px; opacity: 0;
           transition: opacity 150ms; pointer-events: none; }
  #toast.on { opacity: 1; }
  #loupe { position: fixed; width: 200px; height: 200px; border-radius: 50%; border: 2px solid var(--accent);
           pointer-events: none; background-repeat: no-repeat; box-shadow: 0 6px 24px #000a; display: none; z-index: 5; }
  #loupe::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
                  border: 1px solid #fff; border-radius: 50%; }
  #timeline { height: 30px; padding: 6px 16px; background: var(--surface); border-top: 1px solid var(--border); }
  #tl { width: 100%; height: 18px; display: block; cursor: pointer; }
  footer { display: flex; gap: 14px; align-items: center; padding: 8px 16px; background: var(--surface);
           border-top: 1px solid var(--border); flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  kbd { background: var(--border); color: var(--text); border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  #pos { margin-left: auto; color: var(--text); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Marcar</h1>
  <label class="muted" for="clip">Clipe</label>
  <select id="clip"></select>
  <div class="seg" role="group" aria-label="O que marcar">
    <button id="m-ball" aria-pressed="true">Bola</button><button id="m-person" aria-pressed="false">Pessoa</button>
  </div>
  <label class="muted" for="stride">Revisar 1 a cada</label>
  <select id="stride"><option value="100">100 ms</option><option value="200" selected>200 ms</option>
    <option value="500">500 ms</option></select>
  <div id="bar" title="amostras marcadas"><div></div></div>
  <span id="count" class="muted"></span>
  <span id="sam" class="chip">SAM 2: —</span>
</header>
<main>
  <div id="stage"><img id="frame" alt="quadro do clipe"><canvas id="overlay"></canvas></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="loupe"></div>
</main>
<div id="timeline"><canvas id="tl" aria-label="linha do tempo das marcações"></canvas></div>
<footer>
  <span id="hint-click"></span>
  <span><kbd>Enter</kbd> aceitar o SAM</span>
  <span><kbd>⇧</kbd>+clique "não é isso"</span>
  <span><kbd>O</kbd> <span id="hint-o">fora de jogo</span></span>
  <span><kbd>N</kbd> <span id="hint-n">não aparece</span></span>
  <span><kbd>⌫</kbd> limpar quadro</span>
  <span><kbd>←</kbd><kbd>→</kbd> navegar (<kbd>⇧</kbd> ×10)</span>
  <span><kbd>Espaço</kbd> tocar</span>
  <span><kbd>L</kbd> lupa</span>
  <span id="pos"></span>
</footer>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const S = { clips: [], name: null, mode: "ball", meta: null, samples: {}, src: {}, prompts: [], proposals: {},
              proposalsFor: null, promptsHash: null, pending: null, i: 0, playing: null, loupe: true, saveTimer: null, job: null };
  const images = new Map();

  // ---------- helpers
  const stride = () => Number($("stride").value);
  const ms = () => S.i * 100;
  const grid = () => { const out = []; for (let t = 0; t < S.meta.count * 100; t += stride()) out.push(t); return out; };
  function toast(text) {
    const el = $("toast"); el.textContent = text; el.classList.add("on");
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800);
  }
  function frameUrl(i) { return `/frames/${S.name}/${String(i).padStart(5, "0")}.jpg`; }
  function preload(i) {
    for (let k = i; k < Math.min(S.meta.count, i + 12); k++) {
      if (!images.has(k)) { const im = new Image(); im.src = frameUrl(k); images.set(k, im); }
    }
  }
  async function api(path, body) {
    const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify(body) } : {});
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  // ---------- layout
  function fit() {
    if (!S.meta) return;
    const [w, h] = S.meta.size;
    const main = document.querySelector("main").getBoundingClientRect();
    const k = Math.min((main.width - 24) / w, (main.height - 16) / h);
    const img = $("frame"), cv = $("overlay");
    img.style.width = Math.round(w * k) + "px"; img.style.height = Math.round(h * k) + "px";
    cv.width = Math.round(w * k * devicePixelRatio); cv.height = Math.round(h * k * devicePixelRatio);
    cv.style.width = img.style.width; cv.style.height = img.style.height;
    const tl = $("tl"); tl.width = tl.clientWidth * devicePixelRatio; tl.height = tl.clientHeight * devicePixelRatio;
    draw();
  }
  window.addEventListener("resize", fit);

  // ---------- drawing
  function draw() {
    if (!S.meta) return;
    $("frame").src = frameUrl(S.i);
    preload(S.i);
    const cv = $("overlay"), c = cv.getContext("2d"), W = cv.width, H = cv.height, d = devicePixelRatio;
    c.clearRect(0, 0, W, H);
    const t = String(ms());
    const p = S.proposals[String(S.i)];
    const stale = S.proposalsFor !== S.promptsHash || (S.pending && S.i >= S.pending[0] && S.i <= S.pending[1]);
    if (p) {
      c.save();
      c.globalAlpha = stale ? 0.45 : 1;
      c.strokeStyle = "#d6f23f"; c.lineWidth = 3 * d; c.setLineDash(stale ? [6 * d, 5 * d] : []);
      c.shadowColor = "#000"; c.shadowBlur = 3 * d;
      if (S.mode === "ball") {
        const r = Math.max(12 * d, Math.max(p[4] * W, p[5] * H) * 0.7);
        c.beginPath(); c.arc(p[0] * W, p[1] * H, r, 0, 7); c.stroke();
        if (p[6] > 0.004) { c.fillStyle = "#ff8a3d"; c.font = `${12 * d}px system-ui`;
          c.fillText("máscara grande: confira", p[0] * W + r + 4 * d, p[1] * H); }
      } else {
        c.strokeRect(p[2] * W, p[3] * H, p[4] * W, p[5] * H);
      }
      c.restore();
    }
    const v = S.samples[t];
    if (Array.isArray(v)) {
      c.save(); c.strokeStyle = "#000"; c.lineWidth = 2 * d; c.fillStyle = "#35e06b";
      if (v.length === 2) { c.beginPath(); c.arc(v[0] * W, v[1] * H, 6 * d, 0, 7); c.fill(); c.stroke(); }
      else { c.strokeStyle = "#35e06b"; c.lineWidth = 2 * d; c.setLineDash([3 * d, 3 * d]);
             c.strokeRect(v[0] * W, v[1] * H, v[2] * W, v[3] * H); }
      c.restore();
    }
    for (const q of S.prompts) {
      if (Math.round(q.ms / 100) !== S.i) continue;
      c.save(); c.lineWidth = 2 * d; c.strokeStyle = q.neg ? "#ff4d6d" : "#ffffff";
      if (q.kind === "box") { c.setLineDash([5 * d, 4 * d]); c.strokeRect(q.xy[0] * W, q.xy[1] * H, q.xy[2] * W, q.xy[3] * H); }
      else { const x = q.xy[0] * W, y = q.xy[1] * H, s = 7 * d;
             c.beginPath(); c.moveTo(x - s, y); c.lineTo(x + s, y); if (!q.neg) { c.moveTo(x, y - s); c.lineTo(x, y + s); } c.stroke(); }
      c.restore();
    }
    if (v === "out" || v === "none") {
      c.save(); c.fillStyle = v === "out" ? "#ff5a36" : "#ff8a3d"; c.fillRect(10 * d, 10 * d, 170 * d, 26 * d);
      c.fillStyle = "#0b0b09"; c.font = `600 ${13 * d}px system-ui`;
      c.fillText(v === "out" ? $("hint-o").textContent : $("hint-n").textContent, 18 * d, 28 * d); c.restore();
    }
    drawTimeline();
    const g = grid(), done = g.filter((x) => S.samples[String(x)] !== undefined).length;
    $("bar").firstElementChild.style.width = (100 * done / g.length) + "%";
    $("count").textContent = `${done}/${g.length}`;
    const onGrid = ms() % stride() === 0 ? "" : " · fora da grade";
    $("pos").textContent = `${(ms() / 1000).toFixed(1)} s · quadro ${S.i + 1}/${S.meta.count}${onGrid}`;
  }

  function drawTimeline() {
    const cv = $("tl"), c = cv.getContext("2d"), W = cv.width, H = cv.height, n = S.meta.count;
    c.clearRect(0, 0, W, H);
    for (let i = 0; i < n; i++) {
      const t = i * 100, v = S.samples[String(t)], x0 = Math.floor(i * W / n), x1 = Math.floor((i + 1) * W / n);
      let col = null;
      if (Array.isArray(v)) col = S.src[String(t)] === "click" ? "#2aa857" : "#35e06b";
      else if (v === "out") col = "#ff5a36";
      else if (v === "none") col = "#ff8a3d";
      else if (t % stride() === 0) col = S.proposals[String(i)] ? "#4a4d40" : "#2b2d26";
      if (col) { c.fillStyle = col; c.fillRect(x0, H * 0.25, Math.max(1, x1 - x0 - 1), H * 0.75); }
    }
    c.fillStyle = "#ffffff";
    for (const q of S.prompts) { const x = Math.round(q.ms / 100) * W / n; c.fillRect(x, 0, Math.max(2, W / n / 2), H * 0.22); }
    const x = S.i * W / n; c.fillStyle = "#d6f23f"; c.fillRect(x - 1, 0, 3, H);
  }

  // ---------- state changes
  function save() {
    clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(async () => {
      try {
        const r = await api("/api/save", { name: S.name, mode: S.mode, samples: S.samples, src: S.src, prompts: S.prompts });
        S.promptsHash = r.promptsHash; draw(); pollSoon(); loadClips();
      } catch (e) { toast("Não salvou: " + e.message); }
    }, 500);
  }
  function go(i) { S.i = Math.max(0, Math.min(S.meta.count - 1, i)); draw(); }
  function step(dir, k) {
    const s = stride() / 100 * (k || 1);
    let i = dir > 0 ? Math.floor(S.i / (stride() / 100)) * (stride() / 100) + s : Math.ceil(S.i / (stride() / 100)) * (stride() / 100) - s;
    go(i);
  }
  function next() { step(1); }
  function setLabel(v, src) {
    const t = String(ms());
    S.samples[t] = Array.isArray(v) ? v.map((x) => Math.round(x * 10000) / 10000) : v;
    S.src[t] = src; save(); next();
  }
  function addPrompt(kind, xy, neg) {
    S.prompts = S.prompts.filter((q) => !(Math.round(q.ms / 100) === S.i && q.kind === "box" && kind === "box"));
    S.prompts.push({ ms: ms(), kind, xy: xy.map((v) => Math.round(v * 10000) / 10000), neg: !!neg });
  }

  // ---------- pointer: click = point, drag = box, shift+click = negative point
  let down = null;
  function rel(e) { const r = $("frame").getBoundingClientRect();
    return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; }
  $("stage").addEventListener("pointerdown", (e) => { if (e.button !== 0) return; down = { xy: rel(e), shift: e.shiftKey }; });
  window.addEventListener("pointerup", (e) => {
    if (!down || !S.meta) return;
    const a = down.xy, b = rel(e), shift = down.shift; down = null;
    const r = $("frame").getBoundingClientRect();
    const dragged = Math.hypot((b[0] - a[0]) * r.width, (b[1] - a[1]) * r.height) > 8;
    if (shift && !dragged) { addPrompt("point", a, true); save(); draw(); toast("Ponto negativo: o SAM 2 evita isso"); return; }
    if (dragged) {
      const box = [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])];
      addPrompt("box", box, false);
      if (S.mode === "ball") setLabel([box[0] + box[2] / 2, box[1] + box[3] / 2], "click");
      else setLabel(box, "click");
      return;
    }
    addPrompt("point", a, false);
    if (S.mode === "ball") setLabel(a, "click");
    else { save(); draw(); toast("Pessoa indicada: espere o SAM 2 e aceite com Enter (ou arraste uma caixa)"); }
  });

  // ---------- loupe
  $("stage").addEventListener("pointermove", (e) => {
    const lp = $("loupe");
    if (!S.loupe || !S.meta) { lp.style.display = "none"; return; }
    const r = $("frame").getBoundingClientRect(), z = 4;
    lp.style.display = "block";
    lp.style.left = (e.clientX + 24) + "px"; lp.style.top = (e.clientY - 220) + "px";
    lp.style.backgroundImage = `url(${frameUrl(S.i)})`;
    lp.style.backgroundSize = `${r.width * z}px ${r.height * z}px`;
    lp.style.backgroundPosition = `${-(e.clientX - r.left) * z + 100}px ${-(e.clientY - r.top) * z + 100}px`;
  });
  $("stage").addEventListener("pointerleave", () => { $("loupe").style.display = "none"; });

  // ---------- keys
  window.addEventListener("keydown", (e) => {
    if (!S.meta || e.target.tagName === "SELECT") return;
    const k = e.key;
    if (k === "ArrowRight") { e.preventDefault(); step(1, e.shiftKey ? 10 : 1); }
    else if (k === "ArrowLeft") { e.preventDefault(); step(-1, e.shiftKey ? 10 : 1); }
    else if (k === "Home") go(0);
    else if (k === "End") go(S.meta.count - 1);
    else if (k === "Enter") {
      e.preventDefault();
      const p = S.proposals[String(S.i)];
      if (!p) { toast("Sem proposta aqui: clique, O ou N"); return; }
      setLabel(S.mode === "ball" ? [p[0], p[1]] : [p[2], p[3], p[4], p[5]], "sam");
    }
    else if (k === "o" || k === "O") setLabel("out", "click");
    else if (k === "n" || k === "N") setLabel("none", "click");
    else if (k === "Backspace" || k === "Delete") {
      e.preventDefault(); const t = String(ms());
      delete S.samples[t]; delete S.src[t];
      S.prompts = S.prompts.filter((q) => Math.round(q.ms / 100) !== S.i); save(); draw();
    }
    else if (k === " ") { e.preventDefault(); togglePlay(); }
    else if (k === "l" || k === "L") { S.loupe = !S.loupe; toast(S.loupe ? "Lupa ligada" : "Lupa desligada"); }
    else if (k === "p" || k === "P") { api("/api/propagate", { name: S.name, mode: S.mode }).then(pollSoon); }
  });
  function togglePlay() {
    if (S.playing) { clearInterval(S.playing); S.playing = null; return; }
    S.playing = setInterval(() => { if (S.i >= S.meta.count - 1) togglePlay(); else go(S.i + 1); }, 100);
  }
  $("tl").addEventListener("pointerdown", (e) => {
    const r = $("tl").getBoundingClientRect();
    go(Math.floor((e.clientX - r.left) / r.width * S.meta.count));
  });

  // ---------- SAM 2 status
  let pollTimer = null;
  function pollSoon() { clearTimeout(pollTimer); pollTimer = setTimeout(poll, 400); }
  async function poll() {
    try {
      const j = await api("/api/job"); S.job = j;
      const el = $("sam"); el.className = "chip";
      const mine = j.name === S.name && j.mode === S.mode;
      if (j.state === "loading") { el.classList.add("run"); el.textContent = "SAM 2: carregando o modelo"; }
      else if (j.state === "running") { el.classList.add("run");
        el.textContent = `SAM 2: seguindo ${mine ? "" : j.name + " "}${j.done}/${j.total}`; }
      else if (j.state === "error") { el.classList.add("err"); el.textContent = "SAM 2: erro (ver o Terminal)"; el.title = j.msg; }
      else el.textContent = `SAM 2: pronto${j.model ? " · " + j.model : ""}`;
      const busy = j.state === "loading" || j.state === "running" || (j.queued && j.queued.length);
      if (!busy || mine) await refreshProposals();
      if (busy) pollTimer = setTimeout(poll, 800);
    } catch (e) { $("sam").textContent = "SAM 2: servidor fora do ar"; pollTimer = setTimeout(poll, 3000); }
  }
  async function refreshProposals() {
    const d = await api(`/api/clip?name=${encodeURIComponent(S.name)}&mode=${S.mode}`);
    S.proposals = d.proposals; S.proposalsFor = d.proposalsFor; S.promptsHash = d.promptsHash; S.pending = d.pending;
    draw();
  }

  // ---------- open clip / mode
  async function open(name, mode) {
    if (S.playing) togglePlay();
    S.name = name; S.mode = mode; images.clear();
    const d = await api(`/api/clip?name=${encodeURIComponent(name)}&mode=${mode}`);
    S.meta = d.meta; S.samples = d.labels.samples || {}; S.src = d.labels.src || {}; S.prompts = d.labels.prompts || [];
    S.proposals = d.proposals; S.proposalsFor = d.proposalsFor; S.promptsHash = d.promptsHash; S.pending = d.pending;
    const firstOpen = grid().find((t) => S.samples[String(t)] === undefined);
    S.i = firstOpen === undefined ? 0 : firstOpen / 100;
    $("m-ball").setAttribute("aria-pressed", mode === "ball"); $("m-person").setAttribute("aria-pressed", mode === "person");
    $("hint-click").innerHTML = mode === "ball"
      ? "<kbd>clique</kbd> a bola está aqui · <kbd>arrastar</kbd> caixa na bola"
      : "<kbd>arrastar</kbd> caixa na pessoa · <kbd>clique</kbd> indicar a pessoa";
    $("hint-o").textContent = mode === "ball" ? "fora de jogo" : "fora do quadro";
    $("hint-n").textContent = mode === "ball" ? "não aparece" : "escondida";
    try { localStorage.setItem("lab:last", JSON.stringify({ name, mode })); } catch (e) { /* optional */ }
    fit(); poll();
    if (!S.prompts.length) toast(mode === "ball" ? "Comece clicando na bola num quadro em que ela aparece"
                                                 : "Comece arrastando uma caixa em volta do jogador escolhido");
  }
  async function loadClips() {
    S.clips = await api(`/api/clips?stride=${stride()}`);
    const sel = $("clip"), cur = sel.value; sel.innerHTML = "";
    for (const c of S.clips) {
      const b = c.progress.ball, p = c.progress.person, o = document.createElement("option");
      o.value = c.name;
      o.textContent = `${c.name} · ${c.sport} · bola ${b.done}/${b.total}` + (p.done ? ` · pessoa ${p.done}/${p.total}` : "");
      sel.appendChild(o);
    }
    if (cur) sel.value = cur;
  }
  $("clip").addEventListener("change", (e) => { open(e.target.value, S.mode); e.target.blur(); });
  $("m-ball").addEventListener("click", () => open(S.name, "ball"));
  $("m-person").addEventListener("click", () => open(S.name, "person"));
  $("stride").addEventListener("change", (e) => { e.target.blur(); draw(); loadClips(); });
  setInterval(loadClips, 15000);

  (async () => {
    await loadClips();
    let last = null; try { last = JSON.parse(localStorage.getItem("lab:last") || "null"); } catch (e) { last = null; }
    const name = last && S.clips.some((c) => c.name === last.name) ? last.name : S.clips[0].name;
    $("clip").value = name;
    await open(name, last ? last.mode : "ball");
  })();
})();
</script>
</body>
</html>
